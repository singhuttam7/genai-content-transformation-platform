services:
  # ---------------------------------------------------------
  # Backend - FastAPI Docker service
  # ---------------------------------------------------------
  - type: web
    name: genai-backend
    runtime: docker
    plan: 1c-2g
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: genai-content-platform-db
          property: connectionString

      - key: FRONTEND_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: STORAGE_BACKEND
        value: local

      - key: STORAGE_ROOT
        value: /app/data/storage

      - key: MAX_UPLOAD_SIZE_MB
        value: "100"

      # LLM
      - key: LLM_PROVIDER
        value: groq

      - key: LLM_MODEL
        value: openai/gpt-oss-120b

      - key: GROQ_API_KEY
        sync: false

      # OCR
      - key: OCR_ENABLED
        value: "true"

      - key: OCR_PROVIDER
        value: tesseract

      - key: OCR_DEFAULT_LANGUAGE
        value: eng

      # ASR
      - key: ASR_ENABLED
        value: "true"

      - key: ASR_PROVIDER
        value: faster_whisper

      - key: WHISPER_MODEL
        value: small

      - key: WHISPER_DEVICE
        value: cpu

      - key: WHISPER_COMPUTE_TYPE
        value: int8

      # Vision - intentionally disabled for first deployment
      # until we decide how to host Ollama.
      - key: VISION_ENABLED
        value: "false"

      - key: VISION_PROVIDER
        value: local

      - key: VISION_MODEL
        value: gemma3:4b

      - key: OPENAI_API_KEY
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: GOOGLE_API_KEY
        sync: false

    disk:
      name: backend-storage
      mountPath: /app/data/storage
      sizeGB: 10

  # ---------------------------------------------------------
  # Frontend - React/Vite static site
  # ---------------------------------------------------------
  - type: web
    name: genai-frontend
    runtime: static
    rootDir: frontend

    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        sync: false

# -----------------------------------------------------------
# PostgreSQL + pgvector
# -----------------------------------------------------------
databases:
  - name: genai-content-platform-db
    plan: free
    databaseName: genai_content_platform
